<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>집중 타이머</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>집중 타이머</h1>
    <div id="time" role="timer">25:00</div>
    <div class="controls">
      <button id="start" type="button">시작</button>
      <button id="pause" type="button" disabled>일시정지</button>
      <button id="reset" type="button">초기화</button>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
